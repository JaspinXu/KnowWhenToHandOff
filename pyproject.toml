[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "handoff"
version = "0.1.0"
description = "Multi-turn reinforcement learning for trustworthy customer-service agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["hydra-core==1.3.7"]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Explicit: newer ruff also formats Markdown code blocks, which would reflow
# the compact interface sketches in the READMEs.
include = ["*.py", "*.pyi", "*.ipynb", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
