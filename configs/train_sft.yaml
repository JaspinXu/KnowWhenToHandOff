# scripts/train_sft.py: assistant-only SFT of the policy (T2.2, run B2).
defaults:
  - paths: default
  - _self_

experiment: B2
tags: []
seed: 0
execution_kind: real
base_model: qwen3_4b  # models-lock entry to start from
dataset_name: ???  # built by scripts/build_sft_data.py
sft:
  max_length: 32768
  pad_to_multiple_of: 8
  learning_rate: 1.0e-5
  num_train_epochs: 2.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  attn_implementation: sdpa
  use_liger_kernel: false
  fsdp: ""
  seed: ${seed}
  logging_steps: 5
  save_strategy: "no"  # intermediate checkpoints (with optimizer state) cost ~50 GB each
  save_total_limit: 2
  report_to: []
  lora:
    rank: 0
    alpha: 32
    dropout: 0.05
    target_modules: [all-linear]
