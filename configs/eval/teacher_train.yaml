# T2.1 teacher rollouts: train split only (official + hand-off train set),
# all styles, sampled agent so successful trajectories are diverse.
defaults: [_common, _self_]
name: teacher_train
splits: [train]
kinds: [upstream, explicit_request, out_of_scope, hard_negative]
personas: [neutral, terse, verbose, impatient, non-native, low-tech-literacy]
num_trials: 2
pass_k: 2
seed: 1234
max_concurrency: 48
agent_temperature: 0.6
bootstrap_resamples: 200
max_infra_failure_share: 0.05  # teacher data tolerate a few lost episodes
