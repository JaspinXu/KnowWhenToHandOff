# T0.2 / T0.5 smoke test: five official *train* airline tasks, one trial.
# Train only, so no held-out task is looked at while debugging the stack.
name: smoke
domains: [airline]
splits: [train]
kinds: [upstream]
personas: [neutral]
num_trials: 1
seed: 300
max_tasks_per_domain: 5
task_ids: null
max_steps: 200
max_errors: 10
max_concurrency: 5
prompt_variant: handoff_v1
agent_temperature: 0.0
agent_max_tokens: 2048
agent_extra_body: null
user_temperature: 0.7
user_max_tokens: 1024
user_extra_body: null
simulation_timeout_s: 1800
max_retries: 3
allow_test: false
bootstrap_resamples: 200
max_infra_failure_share: 0.0  # more lost episodes: the run is incomplete
pass_k: 1
