# T0.2 / T0.5 smoke test: five official *train* airline tasks, one trial.
# Train only, so no held-out task is looked at while debugging the stack.
defaults: [_common, _self_]
name: smoke
domains: [airline]
splits: [train]
kinds: [upstream]
num_trials: 1
pass_k: 1
max_tasks_per_domain: 5
max_concurrency: 5
bootstrap_resamples: 200
